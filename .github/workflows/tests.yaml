name: test
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: build
        run: |
          cd src/pluging-insert-checker
          go build -buildvcs=false -o pluging-insert-checker