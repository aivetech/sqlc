name: test

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    uses: ./.github/workflows/changed-projects.yml

  test:
    needs: changes
    if: needs.changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    container: golang:1.26

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.changes.outputs.projects) }}

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.project }}
        run: |
          cd "src/${{ matrix.project }}"
          go build -buildvcs=false -o "${{ matrix.project }}"